[project]
name = "normalize-videoclip"
version = "1.0.0"
description = "Batch-normalize audio loudness across a folder of video files, re-encoding legacy containers to MP4 along the way. Library, CLI, and MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["ffmpeg", "video", "audio", "loudnorm", "cli", "mcp"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.2.0"]
dev = ["pytest>=8.0", "mcp>=1.2.0"]

[project.scripts]
normalize-videoclip = "normalize_videoclip.cli:main"
normalize-videoclip-mcp = "normalize_videoclip.mcp_server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["normalize_videoclip*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
