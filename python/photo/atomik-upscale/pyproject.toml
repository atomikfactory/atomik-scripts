[project]
name = "atomik-upscale"
version = "1.0.0"
description = "GPU image upscaler tuned for RTX 3060 Ti (8 GB Ampere) — CLI + MCP server"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.13.0",
    "torchvision==0.28.0",
    "spandrel==0.4.2",
    "spandrel-extra-arches==0.2.0",
    "numpy>=1.26",
    "pillow>=11.0",
    "rich>=14.0",
    "watchdog>=6.0",
    "mcp>=2.1.1",
    "tifffile>=2025.1.10",
]

[project.scripts]
atomik = "atomik_upscale.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atomik_upscale"]

# --- Hardware-pinned wheel source -------------------------------------------
# RTX 3060 Ti = Ampere, compute capability 8.6, driver 595.79 (supports up to CUDA 13.2).
# cu130 wheels carry sm_86 kernels and have the most complete Windows/cp311 set.
# torch 2.9.1/cu128 -> 2.13.0/cu130: fixes GHSA-qfhq-4f3w-5fph, GHSA-rrmf-rvhw-rf47,
# PYSEC-2026-139, PYSEC-2026-2286 (memory corruption in lstm_cell / jit.script).
[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
