[project]
name = "atomik-upscale"
version = "1.0.0"
description = "GPU image upscaler tuned for RTX 3060 Ti (8 GB Ampere) — CLI + MCP server"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.9.1",
    "torchvision==0.24.1",
    "spandrel==0.4.2",
    "spandrel-extra-arches==0.2.0",
    "numpy>=1.26",
    "pillow>=11.0",
    "rich>=14.0",
    "watchdog>=6.0",
    "mcp>=2.1.1",
    "tifffile>=2025.1.10",
]

[project.scripts]
atomik = "atomik_upscale.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atomik_upscale"]

# --- Hardware-pinned wheel source -------------------------------------------
# RTX 3060 Ti = Ampere, compute capability 8.6, driver 595.79.
# cu128 wheels carry sm_86 kernels and have the most complete Windows/cp311 set.
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
